# Exclusively owned upgrade-history workflow. No application is deployed.
name: rem21-upgrade
run-name: ${{ inputs.helio_execution_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: rem21-upgrade-test
        options: [rem21-upgrade-test, rem21-upgrade-production]
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      helio_stage_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: rem21-upgrade-${{ inputs.helio_execution_id || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ always() && inputs.helio_stage_id == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rem21-upgrade-test
    steps:
      - name: Owned fixture test stage
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          echo 'owned fixture test stage completed'

  production:
    needs: test
    if: ${{ always() && inputs.helio_stage_id == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rem21-upgrade-production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: rem21-upgrade-production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sleep 2
          python3 - <<'PY'
          import hashlib, json, os, re, uuid
          uuid.UUID(os.environ["HELIO_RELEASE_ID"])
          assert re.fullmatch(r"[A-Za-z0-9._:-]{1,200}", os.environ["HELIO_EXECUTION_ID"])
          revision = os.environ["WORKFLOW_REVISION"] or os.environ["GITHUB_SHA"]
          assert revision == os.environ["GITHUB_SHA"], "workflow_revision must equal the executing commit"
          body = json.dumps({"application": "rem21-upgrade", "version": os.environ["RELEASE_VERSION"],
                             "commit": os.environ["GITHUB_SHA"]}, sort_keys=True).encode()
          digest = "sha256:" + hashlib.sha256(body).hexdigest()
          payload = {"schema_version": 1, "helio_execution_id": os.environ["HELIO_EXECUTION_ID"],
                     "release_id": os.environ["HELIO_RELEASE_ID"], "artifact_digest": digest,
                     "artifact_uri": "urn:rem21-upgrade@" + digest,
                     "rollback_workflow_id": ".github/workflows/rem21-upgrade.yml", "workflow_revision": revision}
          json.dump({"ref": os.environ["GITHUB_SHA"], "auto_merge": False, "required_contexts": [],
                     "environment": os.environ["TARGET_ENVIRONMENT"], "task": "helio-forward-release",
                     "payload": payload}, open("deployment-evidence.json", "w"))
          print("deploying", digest)
          PY
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          deployment_id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments" --data @deployment-evidence.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments/$deployment_id/statuses" --data '{"state":"success","description":"Synthetic deployment evidence; no application deployed"}' > /dev/null
